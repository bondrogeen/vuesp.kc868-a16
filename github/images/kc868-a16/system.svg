rect x="924" y="230" width="240" height="230" rx="18" fill="#0d1b42" stroke="#a78bfa" stroke-width="2"/><text x="1044" y="286" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="800">Реле / клеммы</text><text x="1044" y="322" text-anchor="middle" fill="#94a3b8" font-size="13">16 реле</text><text x="1044" y="347" text-anchor="middle" fill="#94a3b8" font-size="13">16 входов</text><text x="1044" y="372" text-anchor="middle" fill="#94a3b8" font-size="13">4 аналоговых</text><text x="1044" y="434" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="1">КЛЕММЫ</text>

