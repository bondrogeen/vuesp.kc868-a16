; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
firmware_version = '{5, 0, 0}'
device_name = '"vuesp.kc868-a16"'
; Размер таблицы пиров discovery можно переопределить в build_flags:
;   -D VUESP_MAX_PEERS=8

[platformio]
build_dir = build
default_envs = esp32

[env:esp32]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
build_src_filter = +<*> -<tests/*>
lib_deps = 
  	ESP32Async/AsyncTCP@3.5.0
 	ESP32Async/ESPAsyncWebServer@3.12.1
	paulstoffregen/OneWire@2.3.8
build_flags = 
	-D DEF_DEVICE_FIRMWARE=${common.firmware_version}
	-D DEF_DEVICE_NAME=${common.device_name}
	-D CURRENT_TIME=$UNIX_TIME
	-D DEF_BOARD=2

